[project]
name = "nhtsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = [
    "polars>=2.0.0",
]

[project.scripts]
nhtsa = "nhtsa:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "ty>=0.0.89",
    "umap-learn>=0.6.0",
]

[[tool.ty.overrides]]
# ty can't see the type altair's mark_*() methods return, so every chart is flagged.
include = ["notebooks/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
